[skill_paths]
global    = ["~/.local/share/ms/skills"]
project   = [".ms/skills"]
community = ["~/.local/share/ms/community"]

[layers]
priority          = ["project", "global", "community"]
auto_detect       = true
project_overrides = true

[search]
use_embeddings    = true
embedding_backend = "hash"
bm25_weight       = 0.5
semantic_weight   = 0.5

[cass]
auto_detect     = true
session_pattern = "*.jsonl"

[cm]
enabled = false

[auto_load]
learning_enabled     = true
exploration_rate     = 0.1
persist_state        = true

[security.acip]
enabled    = true
audit_mode = false

[safety]
require_verbatim_approval = false

[cache]
enabled     = true
max_size_mb = 512
ttl_seconds = 3600

[agent_mail]
enabled = false
