db_path      = "~/.local/share/atuin/history.db"
key_path     = "~/.local/share/atuin/key"
session_path = "~/.local/share/atuin/session"

auto_sync    = false
update_check = false

search_mode  = "fuzzy"
filter_mode  = "host"

style            = "compact"
inline_height    = 20
show_preview     = true
max_preview_height = 4
invert           = false
show_help        = true
show_tabs        = true
enter_accept     = true

secrets_filter = true

dialect  = "us"
timezone = "local"

[tmux]
enabled = true
width   = "80%"
height  = "60%"

[sync]
records = true

[daemon]
enabled   = false
autostart = false

[ui]
columns = ["duration", "time", "command"]
