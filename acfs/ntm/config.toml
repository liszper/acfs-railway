projects_base = "/data/projects"

[agents]
claude = "agent-limiter claude --dangerously-skip-permissions"
codex = "agent-limiter codex --dangerously-bypass-approvals-and-sandbox"
gemini = "agent-limiter gemini --yolo"
default_count = 2

[tmux]
pane_init_delay_ms = 500
history_limit = 50000

[resilience]
auto_restart = true
max_restarts = 3
restart_delay_seconds = 30
health_check_seconds = 10

[checkpoints]
enabled = true
before_broadcast = true
max_auto_checkpoints = 10

[cass]
enabled = true
[cass.context]
enabled = true
max_sessions = 3
lookback_days = 30

[recovery]
enabled = true
include_agent_mail = true
include_beads_context = true

[integrations.dcg]
enabled = true

[integrations.caam]
enabled = true
auto_rotate = true

[send]
base_prompt = ""
base_prompt_file = ""
